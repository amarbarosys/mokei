[workspace]
authors = ["amarbaro.org <dev@amarbaro.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mokei"
platforms = ["linux-64"]
description = "Line counter in Mojo, tokei-like, plus diff budgets, tokens, duplicates and untested names"
license = "Apache-2.0"
license-file = "LICENSE"

[tasks]
build = "bash build.sh"
test = "bash tests/test_mokei.sh"
gate = "bash ci.sh"

[dependencies]
mojo = "==1.2.0"
max = "==26.7.0"
python = "3.13.*"   # the test runner's JSON checks only
