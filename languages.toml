# mokei language table. One [[lang]] per language; add a row, no code change.
# exts/filenames: matched on the extension / exact basename.  shebang: interpreter names for extensionless scripts.  line: line-comment tokens.
# block: flat list of (start, end) pairs.  nested: block comments nest.
# quotes: string delimiter bytes.  multiline: the quote bytes whose strings may span lines.  doc: triple quotes at line start are comments.
# nested: block comments nest.  raw: flat (start, end) raw-string pairs, no escapes, may span lines.
# rawdelim: C++ R"delim( )delim" strings.  prose: every non-blank line counts as comment (Markdown, like tokei).

[[lang]]
name = "Python"
exts = ["py", "pyi"]
shebang = ["python"]
line = ["#"]
raw = ["r\"\"\"", "\"\"\"", "r'''", "'''", "r\"", "\"", "r'", "'"]
quotes = "\"'"

[[lang]]
name = "Mojo"
exts = ["mojo", "🔥"]
shebang = ["mojo"]
line = ["#"]
quotes = "\"'`"

[[lang]]
name = "JavaScript"
exts = ["js", "mjs", "cjs", "jsx"]
shebang = ["node"]
line = ["//"]
block = ["/*", "*/"]
quotes = "\"'`"
multiline = "`"

[[lang]]
name = "TypeScript"
exts = ["ts", "tsx"]
line = ["//"]
block = ["/*", "*/"]
