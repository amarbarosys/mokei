multiline = "`"

[[lang]]
name = "Rust"
exts = ["rs"]
line = ["//"]
block = ["/*", "*/"]
nested = true
raw = ["r##\"", "\"##", "r#\"", "\"#", "r\"", "\""]
quotes = "\""
multiline = "\""

